var PN=[['peshin','Peshin'],['asr','Asr'],['shom','Shom']];
function pcalc(dt){var R=Math.PI/180,lat=41.31,lon=69.28,tz=5;
  var D=Math.floor(Date.UTC(dt.getFullYear(),dt.getMonth(),dt.getDate())/86400000)-10957.5+0.5;
  var g=(357.529+0.98560028*D)*R,q=280.459+0.98564736*D,L=(q+1.915*Math.sin(g)+0.020*Math.sin(2*g))*R,e=(23.439-0.00000036*D)*R;
  var RA=Math.atan2(Math.cos(e)*Math.sin(L),Math.cos(L))/R/15;RA=((RA%24)+24)%24;var qq=((q%360)+360)%360/15;var eq=qq-RA;if(eq>12)eq-=24;if(eq<-12)eq+=24;
  var dec=Math.asin(Math.sin(e)*Math.sin(L)),ph=lat*R;
  var noon=12+tz-lon/15-eq;
  function T(a){return Math.acos((Math.sin(a)-Math.sin(dec)*Math.sin(ph))/(Math.cos(dec)*Math.cos(ph)))/R/15}
  var sun=noon+T(-0.833*R);
  var ang=Math.atan(1/(2+Math.tan(Math.abs(ph-dec))));var asr=noon+T(ang);
  function f(h){h=Math.round(h*60);return ('0'+Math.floor(h/60)).slice(-2)+':'+('0'+h%60).slice(-2)}
  return {peshin:f(noon+3/60),asr:f(asr),shom:f(sun+2/60)}}
